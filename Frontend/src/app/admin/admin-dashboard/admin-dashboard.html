<div class="dashboard">

  <!-- TOP CARDS -->
  <div class="cards">

    <div class="card">
      <h4>Total Parents</h4>
      <div class="value">{{ totalParents }}</div>
    </div>

    <div class="card">
      <h4>Total Students</h4>
      <div class="value">{{ totalStudents }}</div>
    </div>

    <div class="card">
      <h4>Male Students</h4>
      <div class="value">{{ maleCount }}</div>
    </div>

    <div class="card">
      <h4>Female Students</h4>
      <div class="value">{{ femaleCount }}</div>
    </div>

    <div class="card">
      <h4>Parents with Children</h4>
      <div class="value">{{ parentsWithChildren }}</div>
    </div>

  </div>

  <!-- CENTER CHART -->
  <div class="chart-box">
    <h3>Students Gender Distribution</h3>
    <canvas id="genderChart"></canvas>
  </div>

</div>
