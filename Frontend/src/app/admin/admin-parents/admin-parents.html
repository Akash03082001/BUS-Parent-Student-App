<div class="parent-page">

  <h2>Parents</h2>

  <!-- SEARCH -->
  <div class="search-bar">
    <input
      type="text"
      [(ngModel)]="searchName"
      placeholder="Search parent by name..."
    />
    <button (click)="search()">Search</button>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="loading">
    Loading...
  </div>

  <!-- TABLE -->
  <div class="table-container" *ngIf="!loading">

    <div class="table-header">
      <div>Name</div>
      <div>Email</div>
      <div>Status</div>
      <div>Actions</div>
    </div>

    <div class="table-row" *ngFor="let p of parents">

      <div>{{ p.name }}</div>
      <div>{{ p.email }}</div>
      <div>{{ p.status }}</div>

      <div class="actions">
        <button class="edit-btn" (click)="editParent(p)">Edit</button>
        <button class="child-btn" (click)="viewChildren(p)">Children</button>
      </div>

    </div>

  </div>

  <!-- EMPTY STATE -->
  <div *ngIf="!loading && parents.length === 0" class="no-data">
    No parents found
  </div>

  <!-- PAGINATION -->
  <div class="pagination">
    <button (click)="prevPage()">Prev</button>
    <span>Page {{ page + 1 }} of {{ totalPages }}</span>
    <button (click)="nextPage()">Next</button>
  </div>

</div>
