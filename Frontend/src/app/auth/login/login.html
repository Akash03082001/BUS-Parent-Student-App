<div class="split-page">

  <!-- BACKGROUND SPLIT -->
  <div class="left-panel"></div>
  <div class="right-panel"></div>

  <!-- CENTER CARD -->
  <div class="card-wrapper">
    <div class="login-card">

      <h2 class="title">
        {{useType === 'PARENT' ? 'Parent Login' : 'Admin Login'}}
      </h2>

      <div class="role-toggle">
        <button 
        type="button"
        [class.active]="useType === 'PARENT'"
        (click)="setRole('PARENT')">
        Parent</button>

        <button
        type="button"
        [class.active]="useType === 'ADMIN'"
        (click)="setRole('ADMIN')">
        Admin</button>
      </div>

      <form #loginForm="ngForm" (ngSubmit)="login()">

        <input
          [(ngModel)]="email"
          name="email"
          type="text"
          placeholder="Email"
          required
          class="input"
        />

        <input
          [(ngModel)]="password"
          name="password"
          type="password"
          placeholder="Password"
          required
          class="input"
        />

        <button
          type="submit"
          class="submit-btn"
          [disabled]="loginForm.invalid">
          Login
        </button>

        <p *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </p>

      </form>

      <p class="footer-text">
        New Parent?
        <a routerLink="/register" class="footer-link">
          Register here
        </a>
      </p>

    </div>
  </div>

</div>
